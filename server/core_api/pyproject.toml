[project]
name = "chushpan-core-api"
version = "0.1.0"
description = "Isolated, Tailscale-only Chushpan Core API for Windows hosts"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/chushpan_core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
