[project]
name = "my-jarvis"
version = "0.2.7"
description = "A Russian voice assistant for macOS with Gemini and local Ollama fallback"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "bleak>=2,<4",
    "httpx>=0.27",
    "numpy>=1.26",
    "sounddevice>=0.5",
    "piper-tts>=1.3",
    "pysilero-vad>=3.0",
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pydantic>=2.7",
    "pydantic-settings[yaml]>=2.3",
    "rich>=13.7",
    "openwakeword>=0.6",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "websockets>=13",
    "pywebview>=6.2",
    "livekit>=1.0",
    "scipy>=1.13",
    "ytmusicapi>=1.12.3,<2",
    "torch>=2.5,<3",
    "google-genai>=2.34,<3",
    "pillow>=11,<14",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

macos-build = [
    "pyinstaller==6.22.0",
    "pyobjc-framework-ServiceManagement==12.2.2",
    "pyobjc-framework-UserNotifications==12.2.2",
    "pyobjc-framework-AVFoundation==12.2.2",
    "pyobjc-framework-ApplicationServices==12.2.2",
    "pyobjc-framework-CoreLocation==12.2.2",
]

[tool.uv]
package = false
# macOS only (MLX, Metal). Also skips Linux-only wheels such as tflite-runtime.
environments = ["sys_platform == 'darwin'"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
