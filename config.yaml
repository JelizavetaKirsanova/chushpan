# Настройки проекта. Личные данные (имя, город, язык) указываются в .env:
#   cp .env.example .env
# Любой параметр можно переопределить переменной окружения; секции разделяются «__»:
#   JARVIS_LLM__MODEL=qwen3.5:9b-q4_K_M

assistant_name: Чушпан
language: ru-RU             # ru-RU; также pt-BR, pt-PT, en-GB, en-US и другие
log_level: INFO
data_dir: data

# Задаются через JARVIS_OWNER_NAME / _GENDER / _TITLE
user:
  name: null
  gender: neutral           # female — женщина, male — мужчина, neutral — без указания пола
  form_of_address: null     # null = по умолчанию для выбранного языка

persona:
  file: personality.md      # единая личность для чата, голосового режима и сводки
  style: null               # необязательные дополнения к файлу личности
  max_sentences: 3           # ориентир для простых вопросов; подробные ответы не ограничивает

# Город задаётся через JARVIS_CITY; координаты определяет Open-Meteo
location:
  query: null

llm:
  provider: gemini           # Gemini — основной; ollama — полностью локальный режим
  fallback: true            # при недоступности Gemini пробовать установленную локальную модель
  host: http://localhost:11434
  model: qwen3.5:9b-q4_K_M # проверенная локальная сборка; исходная qwen3:8b остаётся установлена
  keep_alive: 30m           # для chat и briefing; voice использует resources.profile
  temperature: 0.6
  think: true               # обдумывает ответ; внутренний текст не озвучивается и не сохраняется
  num_ctx: 16384             # место для личности, инструментов и истории; 4096 их обрезает
  context_messages: 30      # включая вызовы инструментов и короткие результаты

gemini:
  model: gemini-3.8-flash
  fallback_model: gemini-3.5-flash # проверен: API перенаправляет на gemini-3.6-flash
  timeout_s: 15              # общий бюджет облачной цепочки
  attempt_timeout_s: 6       # ожидание первого результата; живой поток получает остаток бюджета
  free_tier_confirmed: false # включать в .env после проверки Free tier проекта в AI Studio
  context_messages: 24       # текущая сессия: сообщения, вызовы и результаты инструментов
  context_chars: 24000       # бюджет истории; полные результаты остаются в SQLite

shortcuts:
  allowed:
    Youtube sleep:
      identifier: 1646EE92-B628-481D-9499-CED5B05EC32D
      description: Ждёт окончания видео в активной вкладке Safari, затем усыпляет Mac; проверка каждые 5 секунд
      input_type: none

night:
  external_uuid: 4F1704FB-5A9B-458D-9173-F5CE3727CF9C # проверенный HISENSE, не случайный экран
  external_control: brightness # общая шкала BetterDisplay; компоненты сохраняются отдельно

stt:
  model: mlx-community/whisper-large-v3-turbo
  language: ru

audio:
  input_device: null        # null = системное устройство (список: python -m sounddevice)
  output_device: null
  barge_in: false           # прерывать ответ Чушпан голосом
  echo_cancellation: true   # с barge_in: убирает голос Чушпан из микрофона; наушники не нужны

vad:
  threshold: 0.5
  silence_ms: 1000
  start_ms: 64
  min_speech_ms: 160
  preroll_ms: 400
  tail_ms: 256

tts:
  pronunciations:
    Чушпан: Чушпа́н         # ударение на «а» только в озвучке
  engine: silero            # silero (русский) | piper | say
  silero_model: silero_v5_6_ru.pt  # файл в voices_dir
  silero_speaker: eugene    # eugene | aidar — мужские голоса
  voice: null               # null = по умолчанию для выбранного языка
  voices_dir: models/voices
  say_voice: null
  length_scale: null        # скорость речи: < 1 быстрее, > 1 медленнее

wakeword:
  phrase: эй чушпан         # произвольная фраза; распознаётся локально через Whisper
  enabled: true             # false = слушать постоянно (или voice --no-wake)
  model: hey_jarvis         # используется только при phrase: null
  threshold: 0.5            # настройка: python -m backend wake-test
  listen_timeout_s: 6       # сколько секунд ждать вопрос после «эй чушпан»
  follow_up_s: 8            # сколько секунд слушать после ответа без повторной активации
  chime: true               # короткие звуки при активации и переходе в ожидание

tools:
  enabled: [weather, news, system, timers, clock, memory, media]   # удалите элемент, чтобы отключить функцию
  max_rounds: 3             # максимальное число последовательных вызовов инструментов
  one_moment_after_s: 1.5   # сказать «Ой, ну ща», если модель молчит дольше этого времени

youtube_video:
  playlist_url: https://www.youtube.com/playlist?list=PLSuZQXqwb2Uw
  night_autoplay: true       # видео → яркость 10%/25% → громкость Mac 30% → Youtube sleep
  preferred_screen: external

media:
  provider: youtube_music   # youtube_music | spotify
  youtube_music:
    enabled: true
    bundle_id: com.apple.Safari.WebApp.5DE8E730-70F0-4F8C-9111-4112EC757B26
    app_path: ~/Applications/Music.app
    auth_file: null         # необязательно: библиотека читается из открытого приложения
    timeout_s: 12
    main_playlist:
      id: ''               # сохраняется в памяти после проверки реального плейлиста
      title: Favourite Songs
    scenarios: {}          # назначаются голосом и сохраняются в существующей базе памяти
  duck_to: 0.2              # громкость музыки во время разговора; 0 = не приглушать
  search_wait_s: 6          # сколько секунд ждать результатов поиска
  play_volume: 75           # громкость Spotify при запуске песни; null = не менять

news:
  cache_minutes: 30
  max_items: 5
  feeds:
    - https://news.google.com/rss/search?q=%D0%B8%D1%81%D0%BA%D1%83%D1%81%D1%81%D1%82%D0%B2%D0%B5%D0%BD%D0%BD%D1%8B%D0%B9+%D0%B8%D0%BD%D1%82%D0%B5%D0%BB%D0%BB%D0%B5%D0%BA%D1%82&hl=ru&gl=RU&ceid=RU%3Aru

briefing:
  enabled: true             # погода и новости ИИ при запуске; voice --no-briefing отключает
  headlines: 6              # число заголовков для выбора одной-двух главных новостей
  fetch_timeout_s: 5        # тайм-аут загрузки источника в секундах
  network_wait_s: 20        # сколько секунд ждать подключения к интернету
  once_a_day: true          # сводка только при первом запуске за день
  morning_volume: 20        # Favourite Songs после «Доброе утро, Чушпан», 0–100

resources:
  profile: balanced         # performance: держать модели в памяти; balanced: выгружать через idle_minutes
                            # economy: выгружать сразу при ожидании; повторная загрузка занимает около 15 с
  idle_minutes: 10
  mlx_cache_mb: 64          # лимит кеша GPU для Whisper; без лимита расходуется примерно на 850 МБ больше

server:
  host: 127.0.0.1           # интерфейс: http://127.0.0.1:8765
  port: 8765

hud:
  enabled: true             # интерфейс; voice --no-hud отключает
  window: true              # отдельное окно; false = вкладка браузера
  open_on_start: true       # открывать при запуске, если интерфейс ещё не открыт
